services:
  db:
    image: postgres:16-alpine
    container_name: postgres_16_alpine
    restart: always
    environment:
      POSTGRES_USER: ${user}
      POSTGRES_PASSWORD: ${pass}
      POSTGRES_DB: ${db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  adminer:
    image: adminer
    container_name: adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db
  web:
    build: .
    container_name: php_web
    restart: always
    ports:
      - "3000:80"
    volumes:
      - ./src:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${user}
      DB_PASS: ${pass}
      DB_NAME: ${db}
    depends_on:
      - db

volumes:
  postgres_data:
